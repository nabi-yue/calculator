<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calculator App</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="calculator-container">
            <div class="screen">
                <div class="output">
                    
                </div>
            </div>
            <div class="number-container">
                <button class="number-buttons">
                    1
                </button>
                <button class="number-buttons">
                    2
                </button>
                <button class="number-buttons">
                    3
                </button>
                <button class="number-buttons">
                    4
                </button>
                <button class="number-buttons">
                    5
                </button>
                <button class="number-buttons">
                    6
                </button>
                <button class="number-buttons">
                    7
                </button>
                <button class="number-buttons">
                    8
                </button>
                <button class="number-buttons">
                    9
                 </button>
                <button class="number-buttons">
                    0
                </button>
            </div>
            <div class="operation-container">
                <button class="operation-buttons" id="add">
                    +
                </button>
                <button class="operation-buttons" id="subtract">
                    -
                </button>
                <button class="operation-buttons" id="multiple">
                    x
                </button>
                <button class="operation-buttons" id="divide">
                    ÷
                </button>
                <button class="operation-buttons" id="equals">
                    =
                </button>
                <button class="operation-buttons" id="clear">
                    clear
                </button>
            </div>
        </div>
    </body>
</html>
