<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calculator App</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="calculator-container">
            <div class="screen">
                <div class="output">
                    0123
                </div>
            </div>
            <div class="number-container">
                <button class="number-buttons" id="number-one">
                    1
                </button>
                <button class="number-buttons" id="number-two">
                    2
                </button>
                <button class="number-buttons" id="number-three">
                    3
                </button>
                <button class="number-buttons" id="number-four">
                    4
                </button>
                <button class="number-buttons" id="number-five">
                    5
                </button>
                <button class="number-buttons" id="number-six">
                    6
                </button>
                <button class="number-buttons" id="number-seven">
                    7
                </button>
                <button class="number-buttons" id="number-eight">
                    8
                </button>
                <button class="number-buttons" id="number-nine">
                    9
                </button>
                <button class="number-buttons" id="number-zero">
                    0
                </button>
            </div>
            <div class="operation-container">
                <button class="operation-buttons" id="add">
                    +
                </button>
                <button class="operation-buttons" id="subtract">
                    -
                </button>
                <button class="operation-buttons" id="multiple">
                    x
                </button>
                <button class="operation-buttons" id="divide">
                    ÷
                </button>
                <button class="operation-buttons" id="equals">
                    =
                </button>
                <button class="operation-buttons" id="clear">
                    clear
                </button>
            </div>
        </div>
    </body>
</html>
